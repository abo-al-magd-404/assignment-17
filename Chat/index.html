<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatApp — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #060608;
        --surface: #0e0e14;
        --border: rgba(255, 255, 255, 0.07);
        --accent: #00e5a0;
        --accent2: #7b5ef8;
        --text: #f0f0f8;
        --muted: rgba(240, 240, 248, 0.4);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* Animated background */
      .bg-grid {
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(123, 94, 248, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(123, 94, 248, 0.04) 1px, transparent 1px);
        background-size: 48px 48px;
        z-index: 0;
      }

      .bg-orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.18;
        animation: drift 12s ease-in-out infinite alternate;
        z-index: 0;
      }
      .bg-orb.a {
        width: 500px;
        height: 500px;
        background: var(--accent2);
        top: -120px;
        left: -100px;
        animation-delay: 0s;
      }
      .bg-orb.b {
        width: 400px;
        height: 400px;
        background: var(--accent);
        bottom: -100px;
        right: -80px;
        animation-delay: -5s;
      }

      @keyframes drift {
        from {
          transform: translate(0, 0) scale(1);
        }
        to {
          transform: translate(30px, 20px) scale(1.08);
        }
      }

      /* Login card */
      .card {
        position: relative;
        z-index: 1;
        width: min(440px, 92vw);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 52px 44px 44px;
        backdrop-filter: blur(24px);
        box-shadow:
          0 32px 80px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.04) inset;
        animation: slideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(36px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo-mark {
        width: 48px;
        height: 48px;
        background: linear-gradient(135deg, var(--accent2), var(--accent));
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 28px;
      }

      .logo-mark svg {
        width: 24px;
        height: 24px;
        fill: #fff;
      }

      .card h1 {
        font-family: "Syne", sans-serif;
        font-size: 1.85rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin-bottom: 6px;
        color: var(--text);
      }

      .card p.subtitle {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 38px;
      }

      .field {
        margin-bottom: 20px;
      }

      .field label {
        display: block;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .field input {
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 13px 16px;
        font-family: "DM Sans", sans-serif;
        font-size: 0.95rem;
        color: var(--text);
        transition:
          border-color 0.2s,
          box-shadow 0.2s,
          background 0.2s;
        outline: none;
      }

      .field input::placeholder {
        color: rgba(240, 240, 248, 0.2);
      }

      .field input:focus {
        border-color: var(--accent2);
        background: rgba(123, 94, 248, 0.06);
        box-shadow: 0 0 0 3px rgba(123, 94, 248, 0.15);
      }

      .btn-signin {
        width: 100%;
        margin-top: 8px;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent2), #5a3ed4);
        color: #fff;
        font-family: "Syne", sans-serif;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition:
          transform 0.15s,
          box-shadow 0.2s;
        box-shadow: 0 6px 28px rgba(123, 94, 248, 0.35);
      }

      .btn-signin::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.12),
          transparent
        );
        opacity: 0;
        transition: opacity 0.2s;
      }

      .btn-signin:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 36px rgba(123, 94, 248, 0.45);
      }
      .btn-signin:hover::after {
        opacity: 1;
      }
      .btn-signin:active {
        transform: translateY(1px);
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 28px 0 22px;
      }
      .divider span {
        height: 1px;
        flex: 1;
        background: var(--border);
      }
      .divider em {
        font-style: normal;
        font-size: 0.75rem;
        color: var(--muted);
      }

      .footer-link {
        text-align: center;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .footer-link a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
        transition: opacity 0.15s;
      }
      .footer-link a:hover {
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div class="bg-grid"></div>
    <div class="bg-orb a"></div>
    <div class="bg-orb b"></div>

    <div class="card">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24">
          <path
            d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"
          />
        </svg>
      </div>
      <h1>Welcome</h1>
      <p class="subtitle">Sign in to continue chatting</p>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" required />
      </div>

      <button id="login" class="btn-signin">Sign In →</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./js/index.js"></script>
  </body>
</html>
